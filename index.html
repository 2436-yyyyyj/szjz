<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a1220">
    <meta name="description" content="河北大城东阜神州减震器厂产品目录，支持手机端按型号搜索和系列浏览。">
    <title>神州减震器产品目录</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=20260618">
    <script defer src="./script.js?v=20260618"></script>
  </head>
  <body class="is-splash-active">
    <section id="splashScreen" class="splash-screen" role="button" tabindex="0" aria-label="进入神州减震器产品目录">
      <img id="splashImage" class="splash-image" src="./assets/brand/splash-cover.jpg" alt="神州减震器企业形象图" fetchpriority="high">
      <div class="splash-entry" aria-hidden="true">
        <span>点击进入</span>
        <i></i>
        <small>5 秒后自动进入</small>
      </div>
    </section>

    <header class="topbar">
      <a class="brand" href="#products" aria-label="神州减震器产品目录">
        <span class="brand-mark">SZ</span>
        <span>
          <strong>神州减震器</strong>
          <small>河北大城东阜神州减震器厂</small>
        </span>
      </a>
      <a class="top-call" href="tel:13722608009">电话咨询</a>
    </header>

    <main class="catalog-shell" id="products">
      <aside class="filter-panel" aria-label="产品筛选">
        <section class="intro-panel">
          <p>河北 · 大城</p>
          <h1>神州减震器</h1>
          <span>SHENZHOU SHOCK ABSORBER</span>
          <strong>专业制造20年</strong>
        </section>

        <section class="series-panel">
          <div class="panel-title">
            <span>产品系列</span>
            <strong>151 型号</strong>
          </div>
          <div id="seriesNav" class="series-nav"></div>
        </section>

        <section class="contact-panel">
          <div class="panel-title">
            <span>联系</span>
            <strong>杨礼荣</strong>
          </div>
          <a class="phone-link" href="tel:13722608009">13722608009</a>
          <div class="contact-meta">
            <span>传真：0316-5810489</span>
            <span>邮箱：519767397@qq.com</span>
          </div>
        </section>
      </aside>

      <section class="product-panel" aria-labelledby="productTitle">
        <div class="product-toolbar">
          <div>
            <p>产品目录</p>
            <h2 id="productTitle">按型号浏览产品</h2>
          </div>
          <label class="search-box">
            <span>型号搜索</span>
            <input id="modelSearch" type="search" placeholder="输入 SZ-105 / 105" autocomplete="off">
          </label>
        </div>

        <div class="active-row">
          <span id="activeFilterLabel">全部系列</span>
          <span id="resultCount">151 个型号</span>
        </div>

        <div id="productGrid" class="product-grid"></div>
        <p id="emptyState" class="empty-state" hidden>没有找到匹配型号。</p>
        <button id="loadMore" class="load-more" type="button" hidden>继续显示更多型号</button>
      </section>

      <aside class="detail-panel" aria-label="型号详情">
        <div class="detail-sticky">
          <div class="detail-visual">
            <img id="detailImage" src="./assets/products_1/SZ-001.jpg" alt="SZ-001 两轮车系列" decoding="async">
          </div>
          <div class="detail-copy">
            <span id="detailCategory">两轮车系列</span>
            <h2 id="detailCode">SZ-001</h2>
            <p id="detailSource">来源：第 2 页</p>
          </div>
          <div class="detail-actions">
            <button class="button primary" type="button" data-action="copy-inquiry">复制咨询内容</button>
            <button class="button" type="button" data-action="open-source-page">查看原始页</button>
            <a class="button" href="tel:13722608009">电话咨询</a>
          </div>
        </div>
      </aside>
    </main>

    <section class="source-strip" aria-labelledby="sourceTitle">
      <div>
        <h2 id="sourceTitle">原图册</h2>
      </div>
      <div id="pageRail" class="page-rail"></div>
    </section>

    <dialog id="sourceDialog" class="source-dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <button class="icon-button" type="button" data-action="prev-page" aria-label="上一页">‹</button>
        <div>
          <h3 id="dialogTitle">原始图册页</h3>
          <p id="dialogMeta">第 2 页</p>
        </div>
        <button class="icon-button" type="button" data-action="next-page" aria-label="下一页">›</button>
        <button class="icon-button close" type="button" data-action="close-dialog" aria-label="关闭">×</button>
      </div>
      <img id="dialogImage" src="./assets/catalog/pages/page-02.jpg" alt="原始图册页" loading="lazy" decoding="async">
    </dialog>

    <nav class="mobile-contact" aria-label="快速联系">
      <a href="tel:13722608009">电话咨询</a>
      <button type="button" data-action="copy-contact">复制联系</button>
    </nav>
  </body>
</html>

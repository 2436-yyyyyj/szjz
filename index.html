<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta
      name="description"
      content="河北大城东阜神州减震器厂产品目录，按系列和型号浏览两轮车、三轮车、总成、配件减震器。"
    >
    <title>神州减震器产品目录</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./data.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body class="is-splash-active">
    <section id="splashScreen" class="splash-screen" role="button" tabindex="0" aria-label="进入神州减震器产品目录">
      <img class="splash-image" src="./assets/brand/splash-cover.jpg" alt="神州减震器企业形象图" fetchpriority="high">
      <div class="splash-entry" aria-hidden="true">
        <span>点击进入</span>
        <i></i>
        <small>5 秒后自动进入</small>
      </div>
    </section>

    <header class="topbar">
      <a class="brand" href="#products" aria-label="神州减震器产品目录">
        <span class="brand-mark">SZ</span>
        <span>
          <strong id="navBrand">神州减震器</strong>
          <small id="navCompany">河北大城东阜神州减震器厂</small>
        </span>
      </a>
      <div class="top-actions">
        <button type="button" data-action="copy-contact">复制联系信息</button>
        <a id="topCall" href="tel:13722608009">电话咨询</a>
      </div>
    </header>

    <main class="catalog-workbench" id="products">
      <aside class="filter-panel" aria-label="产品筛选">
        <section class="intro-panel">
          <p id="locationLabel">河北 · 大城</p>
          <h1 id="brandName">神州减震器</h1>
          <span id="englishName">SHENZHOU SHOCK ABSORBER</span>
          <strong id="years">专业制造20年</strong>
        </section>

        <section class="series-panel">
          <div class="panel-title">
            <span>产品系列</span>
            <strong id="productTotal">151 型号</strong>
          </div>
          <div id="seriesNav" class="series-nav"></div>
        </section>

        <section class="contact-panel">
          <div class="panel-title">
            <span>联系</span>
            <strong id="contactName">杨礼荣</strong>
          </div>
          <a id="phoneLink" class="phone-link" href="tel:13722608009">13722608009</a>
          <div class="contact-meta">
            <span id="faxText">0316-5810489</span>
            <span id="emailText">519767397@qq.com</span>
          </div>
        </section>
      </aside>

      <section class="product-panel" aria-labelledby="productTitle">
        <div class="product-toolbar">
          <div>
            <p>产品目录</p>
            <h2 id="productTitle">按型号浏览产品</h2>
          </div>
          <label class="search-box">
            <span>型号搜索</span>
            <input id="modelSearch" type="search" placeholder="输入 SZ-105 / 105">
          </label>
        </div>

        <div class="active-row">
          <span id="activeFilterLabel">全部系列</span>
          <span id="resultCount">151 个型号</span>
        </div>

        <div id="productGrid" class="product-grid"></div>
        <p id="emptyState" class="empty-state" hidden>没有找到匹配型号。</p>
      </section>

      <aside class="detail-panel" aria-label="型号详情">
        <div class="detail-sticky">
          <div class="detail-visual">
            <img id="detailImage" src="./assets/products_1/SZ-001.jpg" alt="产品型号图片">
          </div>
          <div class="detail-copy">
            <span id="detailCategory">两轮车系列</span>
            <h2 id="detailCode">SZ-001</h2>
            <p id="detailSource">来源：第 2 页</p>
          </div>
          <div class="detail-actions">
            <button class="button primary" type="button" data-action="copy-inquiry">复制咨询内容</button>
            <button class="button" type="button" data-action="open-source-page">查看原始页</button>
            <a id="detailCall" class="button" href="tel:13722608009">电话咨询</a>
          </div>
        </div>
      </aside>
    </main>

    <section class="source-strip" aria-labelledby="sourceTitle">
      <div>
        <h2 id="sourceTitle">原图册</h2>
      </div>
      <div id="pageRail" class="page-rail"></div>
    </section>

    <dialog id="sourceDialog" class="source-dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <button class="icon-button" type="button" data-action="prev-page" aria-label="上一页">‹</button>
        <div>
          <h3 id="dialogTitle">原始图册页</h3>
          <p id="dialogMeta">第 2 页</p>
        </div>
        <button class="icon-button" type="button" data-action="next-page" aria-label="下一页">›</button>
        <button class="icon-button close" type="button" data-action="close-dialog" aria-label="关闭">×</button>
      </div>
      <img id="dialogImage" src="./assets/catalog/pages/page-02.jpg" alt="原始图册页">
    </dialog>

    <footer class="mobile-contact">
      <span id="stickyCode">SZ-001</span>
      <a id="stickyCall" href="tel:13722608009">电话咨询 13722608009</a>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
